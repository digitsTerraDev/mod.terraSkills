name: Build and Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  build:
    name: Build TerraSkills
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout TerraLib
        uses: actions/checkout@v7
        with:
          repository: digitsTerraDev/mod.terraLib
          ref: v0.1.0
          path: terralib

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and verify
        shell: bash
        run: |
          terralib_version="$(sed -n 's/^terralib_version=//p' gradle.properties)"
          test -n "${terralib_version}"
          (cd terralib && env -u GITHUB_REF_TYPE -u GITHUB_REF_NAME ./gradlew publish -Pmod_version="${terralib_version}")
          test -f "terralib/repo/com/digitscodecompendium/terralib/terralib/${terralib_version}/terralib-${terralib_version}.pom"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ./gradlew clean build -Pterralib_repo=terralib/repo -Prelease_version="${GITHUB_REF_NAME#v}"
          else
            ./gradlew clean build -Pterralib_repo=terralib/repo
          fi

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release
          cp build/libs/terraskills-*.jar release/
          cd release
          sha256sum *.jar > SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: terraskills-${{ github.ref_name }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built JAR
        uses: actions/download-artifact@v8
        with:
          name: terraskills-${{ github.ref_name }}
          path: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release/*
          --repo "${GITHUB_REPOSITORY}"
          --title "TerraSkills ${GITHUB_REF_NAME#v}"
          --generate-notes
          --verify-tag
